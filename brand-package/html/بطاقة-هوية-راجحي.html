<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="utf-8"/>
<title>بطاقة فضية — الراجحي</title>
<style>
@font-face{font-family:'Thmanyah Sans';src:url('../fonts/thmanyahsans-Light.otf');font-weight:300}
@font-face{font-family:'Thmanyah Sans';src:url('../fonts/thmanyahsans-Regular.otf');font-weight:400}
@font-face{font-family:'Thmanyah Sans';src:url('../fonts/thmanyahsans-Medium.otf');font-weight:500 600}
@font-face{font-family:'Thmanyah Sans';src:url('../fonts/thmanyahsans-Bold.otf');font-weight:700}
@font-face{font-family:'Thmanyah Sans';src:url('../fonts/thmanyahsans-Black.otf');font-weight:900}
*{box-sizing:border-box;margin:0;padding:0}
body{
  margin:0;background:#1a1c1e;display:flex;align-items:center;justify-content:center;
  min-height:100vh;
}
#card{
  width:1536px;height:969px;position:relative;overflow:hidden;border-radius:28px;
  background:
    radial-gradient(ellipse 70% 55% at 20% 40%, rgba(255,255,255,.10), transparent 55%),
    linear-gradient(120deg, #9a96b0 0%, #8b87a3 45%, #7f7b97 100%);
  box-shadow:
    0 40px 80px rgba(0,0,0,.45),
    inset 0 1px 0 rgba(255,255,255,.25);
}
#card::after{
  content:"";position:absolute;inset:0;border-radius:28px;pointer-events:none;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.18);
}
.product{
  position:absolute;top:64px;left:68px;
  color:#fff;
}
.product .ar{
  font-family:'Thmanyah Sans',sans-serif;
  font-size:36px;font-weight:700;line-height:1.15;
  direction:rtl;text-align:left;
}
.product .en{
  margin-top:8px;
  font-family:'Thmanyah Sans',Helvetica Neue,Helvetica,Arial,sans-serif;
  font-size:20px;font-weight:500;letter-spacing:.04em;
  color:#fff;
}
.bank{
  position:absolute;top:52px;right:60px;
}
.bank img{
  height:142px;width:auto;display:block;
  filter:brightness(0) invert(1);
}
.mada{
  position:absolute;right:60px;top:50%;transform:translateY(-50%);
}
.mada img{
  height:92px;width:auto;display:block;
  filter:brightness(0) invert(1);
}
.visa{
  position:absolute;right:52px;bottom:36px;
}
.visa img{
  height:120px;width:auto;display:block;
  filter:brightness(0) invert(1);
}
</style>
</head>
<body>
<div id="card">
  <div class="product">
    <div class="ar">تميز ماسي</div>
    <div class="en">diamond affluent</div>
  </div>

  <div class="bank">
    <img src="../png/بطاقة-فضية/alrajhi-logo.svg" alt="مصرف الراجحي"/>
  </div>

  <div class="mada">
    <img src="../png/بطاقة-فضية/mada-logo-white.svg" alt="mada"/>
  </div>
  <div class="visa">
    <img src="../png/بطاقة-فضية/visa-signature-chrome.png" alt="Visa Signature"/>
  </div>
</div>
</body>
</html>
