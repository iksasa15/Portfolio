<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="utf-8"/>
<title>بطاقة فضية — الراجحي</title>
<style>
@font-face{font-family:'Thmanyah Sans';src:url('../fonts/thmanyahsans-Light.otf');font-weight:300}
@font-face{font-family:'Thmanyah Sans';src:url('../fonts/thmanyahsans-Regular.otf');font-weight:400}
@font-face{font-family:'Thmanyah Sans';src:url('../fonts/thmanyahsans-Medium.otf');font-weight:500 600}
@font-face{font-family:'Thmanyah Sans';src:url('../fonts/thmanyahsans-Bold.otf');font-weight:700}
@font-face{font-family:'Thmanyah Sans';src:url('../fonts/thmanyahsans-Black.otf');font-weight:900}
*{box-sizing:border-box;margin:0;padding:0}
body{
  margin:0;background:#1a1c1e;display:flex;align-items:center;justify-content:center;
  min-height:100vh;
}
#card{
  width:1536px;height:969px;position:relative;overflow:hidden;border-radius:28px;
  /* Diamond Affluent lavender-grey #8B87A3 */
  background:
    radial-gradient(ellipse 75% 60% at 85% 10%, rgba(255,255,255,.16), transparent 55%),
    radial-gradient(ellipse 55% 50% at 15% 20%, rgba(255,255,255,.08), transparent 50%),
    linear-gradient(152deg, #9a96b0 0%, #8b87a3 38%, #7e7a96 68%, #736f8a 100%);
  box-shadow:
    0 40px 80px rgba(0,0,0,.45),
    inset 0 1px 0 rgba(255,255,255,.28),
    inset 0 -1px 0 rgba(0,0,0,.1);
}
#card::before{
  content:"";position:absolute;inset:0;pointer-events:none;opacity:.28;mix-blend-mode:soft-light;
  background:
    repeating-linear-gradient(92deg, transparent 0 1px, rgba(255,255,255,.04) 1px 2px),
    repeating-linear-gradient(0deg, transparent 0 2px, rgba(0,0,0,.03) 2px 3px);
}
#card::after{
  content:"";position:absolute;inset:0;border-radius:28px;pointer-events:none;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.22);
}
/* Diamond Affluent curved swoosh */
.swoosh{
  position:absolute;inset:0;pointer-events:none;
  background:
    radial-gradient(ellipse 130% 100% at -10% 120%, rgba(70,68,95,.72) 0%, transparent 52%),
    radial-gradient(ellipse 95% 75% at 55% 138%, rgba(90,87,115,.48) 0%, transparent 48%);
}
.sheen{
  position:absolute;width:560px;height:560px;border-radius:50%;
  background:radial-gradient(circle, rgba(242,243,245,.14), transparent 68%);
  left:38%;top:8%;pointer-events:none;filter:blur(8px);
}
.product{
  position:absolute;top:64px;left:68px;
  color:#F2F3F5;
  text-shadow:0 1px 2px rgba(40,38,60,.2);
}
.product .ar{
  font-family:'Thmanyah Sans',sans-serif;
  font-size:36px;font-weight:700;line-height:1.15;
  direction:rtl;text-align:left;
}
.product .en{
  margin-top:8px;
  font-family:'Thmanyah Sans',Helvetica Neue,Helvetica,Arial,sans-serif;
  font-size:20px;font-weight:500;letter-spacing:.04em;
  color:#F2F3F5;opacity:.95;
}
.bank{
  position:absolute;top:52px;right:60px;
}
.bank img{
  height:142px;width:auto;display:block;
  filter:drop-shadow(0 2px 4px rgba(40,38,60,.25));
}
.mada{
  position:absolute;right:60px;top:50%;transform:translateY(-50%);
}
.mada img{
  height:92px;width:auto;display:block;
  filter:drop-shadow(0 2px 4px rgba(40,38,60,.25));
}
.visa{
  position:absolute;right:52px;bottom:36px;
}
.visa img{
  height:120px;width:auto;display:block;
  filter:drop-shadow(0 2px 4px rgba(40,38,60,.25));
}
</style>
</head>
<body>
<div id="card">
  <div class="swoosh"></div>
  <div class="sheen"></div>

  <div class="product">
    <div class="ar">تميز ماسي</div>
    <div class="en">diamond affluent</div>
  </div>

  <div class="bank">
    <img src="../png/بطاقة-فضية/alrajhi-logo-chrome.svg" alt="مصرف الراجحي"/>
  </div>

  <div class="mada">
    <img src="../png/بطاقة-فضية/mada-logo-chrome.svg" alt="mada"/>
  </div>
  <div class="visa">
    <img src="../png/بطاقة-فضية/visa-signature-chrome.png" alt="Visa Signature"/>
  </div>
</div>
</body>
</html>
