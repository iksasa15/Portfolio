<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="utf-8"/>
<title>بطاقة فضية — الراجحي</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  margin:0;background:#1a1c1e;display:flex;align-items:center;justify-content:center;
  min-height:100vh;
}
#card{
  width:1536px;height:969px;position:relative;overflow:hidden;border-radius:28px;
  background:
    radial-gradient(ellipse 70% 55% at 88% 8%, rgba(255,255,255,.28), transparent 55%),
    radial-gradient(ellipse 55% 45% at 12% 18%, rgba(255,255,255,.14), transparent 50%),
    linear-gradient(155deg, #d5dae0 0%, #b7bec8 32%, #9ea7b2 58%, #8a939e 78%, #7a838e 100%);
  box-shadow:
    0 40px 80px rgba(0,0,0,.45),
    inset 0 1px 0 rgba(255,255,255,.55),
    inset 0 -1px 0 rgba(0,0,0,.12);
}
#card::before{
  content:"";position:absolute;inset:0;pointer-events:none;opacity:.35;mix-blend-mode:soft-light;
  background:
    repeating-linear-gradient(92deg, transparent 0 1px, rgba(255,255,255,.05) 1px 2px),
    repeating-linear-gradient(0deg, transparent 0 2px, rgba(0,0,0,.035) 2px 3px);
}
#card::after{
  content:"";position:absolute;inset:0;border-radius:28px;pointer-events:none;
  box-shadow:
    inset 0 0 0 1px rgba(255,255,255,.35),
    inset 0 0 0 2px rgba(180,170,150,.18);
}
.swoosh{
  position:absolute;inset:0;pointer-events:none;
  background:
    radial-gradient(ellipse 125% 95% at -8% 118%, rgba(55,60,68,.78) 0%, transparent 52%),
    radial-gradient(ellipse 90% 70% at 58% 135%, rgba(70,76,86,.55) 0%, transparent 48%);
}
.accent-bar{
  position:absolute;top:0;left:0;right:0;height:4px;
  background:linear-gradient(90deg,
    rgba(196,178,140,.15) 0%,
    rgba(220,205,175,.85) 35%,
    rgba(255,255,255,.7) 50%,
    rgba(220,205,175,.85) 65%,
    rgba(196,178,140,.15) 100%);
}
.sheen{
  position:absolute;width:560px;height:560px;border-radius:50%;
  background:radial-gradient(circle, rgba(255,255,255,.22), transparent 68%);
  left:38%;top:10%;pointer-events:none;filter:blur(6px);
}
.bank{
  position:absolute;top:52px;right:60px;
}
.bank img{
  height:118px;width:auto;display:block;
  filter:drop-shadow(0 3px 6px rgba(0,0,0,.28));
}
.mada{
  position:absolute;right:60px;top:50%;transform:translateY(-50%);
}
.mada img{
  height:92px;width:auto;display:block;
  filter:drop-shadow(0 3px 6px rgba(0,0,0,.28));
}
.visa{
  position:absolute;right:60px;bottom:44px;
}
.visa img{
  height:78px;width:auto;display:block;
  filter:drop-shadow(0 3px 6px rgba(0,0,0,.28));
}
</style>
</head>
<body>
<div id="card">
  <div class="accent-bar"></div>
  <div class="swoosh"></div>
  <div class="sheen"></div>

  <div class="bank">
    <img src="../png/بطاقة-فضية/alrajhi-logo-chrome.svg" alt="مصرف الراجحي"/>
  </div>

  <div class="mada">
    <img src="../png/بطاقة-فضية/mada-logo-chrome.svg" alt="mada"/>
  </div>
  <div class="visa">
    <img src="../png/بطاقة-فضية/visa-logo-chrome.svg" alt="Visa"/>
  </div>
</div>
</body>
</html>
