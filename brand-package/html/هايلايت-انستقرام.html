<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"/>
<title>هايلايت إنستقرام — هوية الإشارة</title>
<style>
@font-face{font-family:'Thmanyah Sans';src:url('../fonts/thmanyahsans-Medium.otf');font-weight:500 600}
@font-face{font-family:'Thmanyah Sans';src:url('../fonts/thmanyahsans-Bold.otf');font-weight:700}
body{margin:0;background:#171a1f;font-family:'Thmanyah Sans',sans-serif}
.wrap{display:flex;flex-direction:column;gap:48px;align-items:center;padding:48px 0 80px}
.label{width:1080px;color:rgba(242,244,246,.55);font-size:22px}
.grid{display:flex;flex-wrap:wrap;gap:36px;justify-content:center;max-width:1400px}
.hl{
  width:1080px;height:1080px;border-radius:50%;
  background-color:#0b0d10;
  background-image:radial-gradient(rgba(242,244,246,.07) 1.5px,transparent 1.5px);
  background-size:36px 36px;
  display:flex;align-items:center;justify-content:center;
  position:relative;overflow:hidden;
}
.hl svg{width:420px;height:420px}
.hl.solid{background-image:none;background:#0b0d10}
.hl.teal{
  background:#4fd8c4;background-image:none;
}
.hl.teal svg{stroke:#0b0d10}
.hl.surface{
  background:#171a1f;background-image:none;
  box-shadow:inset 0 0 0 8px rgba(79,216,196,.35);
}
.sheet{
  width:1080px;min-height:1920px;box-sizing:border-box;padding:72px 64px;
  background-color:#0b0d10;
  background-image:radial-gradient(rgba(242,244,246,.08) 1.4px,transparent 1.4px);
  background-size:40px 40px;
  color:#f2f4f6;
}
.mini{
  width:160px;height:160px;border-radius:50%;
  background:#0b0d10;display:flex;align-items:center;justify-content:center;
  border:2px solid rgba(255,255,255,.08);
}
.mini svg{width:72px;height:72px}
.cell{display:flex;flex-direction:column;align-items:center;gap:14px}
.cell span{font-size:22px;color:#8a93a0}
</style>
</head>

      <div class="cell"><div class="mini"><svg viewBox="0 0 96 96" fill="none" stroke="#4fd8c4" stroke-width="5.5" stroke-linecap="round"><circle cx="26" cy="48" r="8"/><circle cx="70" cy="26" r="8"/><circle cx="70" cy="70" r="8"/><path d="M33 44l30-14M33 52l30 14"/></svg></div><span>تعلم الآلة</span></div>
